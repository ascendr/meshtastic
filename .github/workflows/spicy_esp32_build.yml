name: Nightly Spicy ESP32S3 Build

on:
  schedule:
    - cron: '0 2 * * *' # Runs nightly at 2:00 AM UTC
  workflow_dispatch: # Allows manual trigger anytime
permissions:
  contents: write
jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout upstream codebase with full history so we can see tags
      - name: Checkout Official Meshtastic Firmware
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: develop
          fetch-depth: 0
          submodules: true

      # Step 2: RESTORE THE TRACKER FIRST (Fixed placement and keys)
      - name: Restore Tag Tracker Cache
        uses: actions/cache@v4
        with:
          path: .last_built_tag
          key: tag-tracker-cache-${{ github.run_id }} # Unique key forces a save at the end
          restore-keys: |
            tag-tracker-cache-

      # Step 3: Identify the latest tag and compare (Fixed logic)
      - name: Detect Latest Upstream Tag
        id: tag_check
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          echo "Latest Meshtastic tag: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

          LAST_BUILT_TAG=""
          if [ -f .last_built_tag ]; then
            LAST_BUILT_TAG=$(cat .last_built_tag)
          fi
          echo "Last successfully compiled tag: $LAST_BUILT_TAG"

          if [ "$LATEST_TAG" = "$LAST_BUILT_TAG" ]; then
            echo "No new firmware tag detected. Exiting."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New tag found! Proceeding with custom compilation."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      # Step 4: MOVE CODE TO THE TAG (Fixed: Actually targets the tag version)
      - name: Switch Codebase to Tag Version
        if: steps.tag_check.outputs.should_build == 'true'
        run: |
          git checkout ${{ steps.tag_check.outputs.latest_tag }}
          git submodule update --init --recursive

      # Step 5: Checkout your own local build repo files
      - name: Checkout My Custom Configuration Files
        if: steps.tag_check.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          path: my-config

      # Step 6: Establish runtime environment
      - name: Set up Python
        if: steps.tag_check.outputs.should_build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 7: Cache PlatformIO
      - name: Cache PlatformIO
        if: steps.tag_check.outputs.should_build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}

      # Step 8: Install PlatformIO CLI
      - name: Install PlatformIO CLI
        if: steps.tag_check.outputs.should_build == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      # Step 9: Overwrite the file using the local 'my-config' path
      - name: Overwrite variant.h File
        if: steps.tag_check.outputs.should_build == 'true'
        run: |
          cp my-config/xxtra_spicy/esp32s3/variant.h variants/esp32s3/seeed_xiao_s3/variant.h
      
      # Step 10: Compile natively using the root config file
      - name: Run PlatformIO Build
        if: steps.tag_check.outputs.should_build == 'true'
        run: |
          pio run -e seeed-xiao-s3
          echo "${{ steps.tag_check.outputs.latest_tag }}" > .last_built_tag

      # Step 11: Stage, rename, and compress files into the local config repo path
      - name: Add Zip File to Custom Config Repo
        if: steps.tag_check.outputs.should_build == 'true'
        run: |
          # 1. Create a temporary folder to collect files for the zip archive
          TEMP_ZIP_DIR="temp_spicy_build"
          mkdir -p "$TEMP_ZIP_DIR"
          
          # 2. Collect and rename files matching 'firmware-*.bin' with the 'spicy-' prefix
          for file in .pio/build/seeed-xiao-s3/firmware-*.bin; do
            [ -e "$file" ] || continue
            FILENAME=$(basename "$file")
            NEW_NAME="${FILENAME/firmware-/firmware-spicy-}"
            cp "$file" "$TEMP_ZIP_DIR/$NEW_NAME"
          done
          
          # 3. Ensure target directory inside your custom repo folder exists
          TARGET_DIR="my-config/xxtra_spicy/esp32s3/firmware"
          mkdir -p "$TARGET_DIR"
          
          # 4. Create the zip archive directly inside the target directory path
          ZIP_NAME="firmware-spicy-seeed-xiao-s3-${{ steps.tag_check.outputs.latest_tag }}.zip"
          zip -j -r "$TARGET_DIR/$ZIP_NAME" "$TEMP_ZIP_DIR"/*
          
          echo "Zip file created successfully at $TARGET_DIR/$ZIP_NAME"

      # Step 12: Commit and push the zip file back to your configuration repository
      - name: Push Zip File Upstream
        if: steps.tag_check.outputs.should_build == 'true'
        run: |
          # Change context to your checked-out local configuration directory
          cd my-config
          
          # Configure git identity using the standard GitHub Actions bot credentials
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Stage the new zip file
          git add xxtra_spicy/esp32s3/firmware/*.zip
          
          # Commit only if files have changed to prevent empty-commit workflow failures
          if git diff-index --quiet HEAD; then
            echo "No changes detected in binaries. Skipping push."
          else
            git commit -m "Automated Build: Spicy seeed xiao esp32s3 firmware zip for version ${{ steps.tag_check.outputs.latest_tag }}"
            git push origin HEAD
            echo "Changes successfully pushed to repository!"
          fi


