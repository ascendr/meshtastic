name: Nightly Spicy ESP32S3 Build

on:
  schedule:
    - cron: '0 2 * * *' # Runs nightly at 2:00 AM UTC
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout ONLY the official upstream Meshtastic codebase
      - name: Checkout Official Meshtastic Firmware
        uses: actions/checkout@v4
        with:
          repository: meshtastic/firmware
          ref: develop
          fetch-depth: 0

      # Step 2: Identify the latest tag on the Meshtastic develop branch
      - name: Detect Latest Upstream Tag
        id: tag_check
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          echo "Latest Meshtastic tag: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT

          # Read cache token from previous run
          LAST_BUILT_TAG=""
          if [ -f .last_built_tag ]; then
            LAST_BUILT_TAG=$(cat .last_built_tag)
          fi
          echo "Last successfully compiled tag: $LAST_BUILT_TAG"

          if [ "$LATEST_TAG" = "$LAST_BUILT_TAG" ]; then
            echo "No new firmware tag detected. Exiting."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New tag found! Proceeding with custom compilation."
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      # Step 3: Cache the tracker file between workflow executions
      - name: Cache Tag Tracker
        if: steps.tag_check.outputs.should_build == 'true'
        uses: actions/cache@v4
        with:
          path: .last_built_tag
          key: build-tag-${{ steps.tag_check.outputs.latest_tag }}

      # Step 4: Checkout your own local build repo files (where variant.h lives)
      # We clone it into a subfolder named 'my-config'
      - name: Checkout My Custom Configuration Files
        if: steps.tag_check.outputs.should_build == 'true'
        uses: actions/checkout@v4
        with:
          path: my-config

      # Step 5: Establish runtime environment
      - name: Set up Python
        if: steps.tag_check.outputs.should_build == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache PlatformIO
        if: steps.tag_check.outputs.should_build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}

      - name: Install PlatformIO CLI
        if: steps.tag_check.outputs.should_build == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      # Step 6: Overwrite the file using the local 'my-config' path
      - name: Overwrite variant.h File
        if: steps.tag_check.outputs.should_build == 'true'
        run: |
          cp my-config/xxtra_spicy/esp32s3/variant.h variants/esp32s3/seeed_xiao_s3/variant.h

      # Step 7: Compile and update tracker token on success
      - name: Run PlatformIO Build
        if: steps.tag_check.outputs.should_build == 'true'
        run: |
          pio run -e seeed_xiao_s3
          echo "${{ steps.tag_check.outputs.latest_tag }}" > .last_built_tag

      # Step 8: Move binary to target repository folder
      - name: Stage Binary in Repo Path
        if: steps.tag_check.outputs.should_build == 'true'
        run: |
          # Create your targeted folder path inside your configuration checkout space
          mkdir -p my-config/builds/
          
          # Move and rename the dynamic binary file directly to your target directory
          cp .pio/build/seeed_xiao_s3/firmware.bin my-config/builds/firmware-${{ steps.tag_check.outputs.latest_tag }}-spicy_esp32s3.bin

      # Step 9: Upload Compiled Binary Assets targeting your new exact folder path
      - name: Upload Firmware Artifacts
        if: steps.tag_check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.tag_check.outputs.latest_tag }}-spicy_esp32s3
          # Change this path to point exactly to your newly created custom folder structure
          path: my-config/builds/firmware-${{ steps.tag_check.outputs.latest_tag }}-spicy_esp32s3.bin
          retention-days: 14
